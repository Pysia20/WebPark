<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Not Pico Park</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="public/sprites/playerPlaceholder.png" type="image/x-icon">
</head>
<body>

    <div class="container">
        <main class="main">
            <div class="inputs">
                <div class="data">
                    <label for="roomId"> ROOM ID </label>
                    <input type="text" id="roomId">
                    <label for="playerName"> PLAYER NAME </label>
                    <input type="text" id="playerName">
                </div>
                <div class="buttons">
                    <button id="createRoom"> CREATE </button>
                    <button id="joinRoom"> JOIN </button>
                </div>
            </div>
            <div class="preview">
                <input type="color" id="playerColor" value="#ffffff">
                <label for="playerColor" id="colorPreview"> <img src="public/sprites/farmerThatDoesHarvestingWoahLookTHatsTheThemeFRFR.png" alt="color preview"> </label>
            </div>
        </main>
    </div>

    <script src="index.ts" type="module"></script>
</body>
</html>
